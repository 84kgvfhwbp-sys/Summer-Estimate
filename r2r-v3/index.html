<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0b">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="Interactive R2R Property Care public website concept.">
  <title>R2R Property Care — Interactive Website Concept V3</title>
  <link rel="stylesheet" href="styles-1.css">
  <link rel="stylesheet" href="styles-2.css">
  <link rel="stylesheet" href="styles-3.css">
</head>
<body>
  <div id="siteRoot"><div class="prototype-loading">Loading R2R interactive concept…</div></div>
  <script>
    (async()=>{
      const parts=['fragments/01-header-hero.html','fragments/02-services-estimate.html','fragments/03-projects-equipment.html','fragments/04-process-footer.html'];
      try{
        const html=(await Promise.all(parts.map(async path=>{const r=await fetch(path);if(!r.ok)throw new Error(path);return r.text()}))).join('');
        document.getElementById('siteRoot').outerHTML=html;
        const script=document.createElement('script');script.src='app.js';document.body.appendChild(script);
      }catch(error){document.getElementById('siteRoot').innerHTML='<div class="prototype-loading">The preview could not load. Refresh the page and try again.</div>';console.error(error)}
    })();
  </script>
</body>
</html>
